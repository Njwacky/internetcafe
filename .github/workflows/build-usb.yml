name: Build USB Portable & Installer Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cafedesk-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt -r requirements-postgres-test.txt

      - name: Check version consistency (version.py is the single source)
        run: python tools/check_version_sync.py --check

      - name: Check owner digest is in sync (browser == database)
        run: python tools/sync_owner_digest.py --check

      - name: Run unit tests including real PostgreSQL concurrency
        env:
          # Test-only local service. The suite creates/drops a random database;
          # it never uses Supabase or any existing application's database.
          CAFEDESK_TEST_POSTGRES_DSN: postgresql://postgres:cafedesk-test-only@127.0.0.1:5432/postgres
        run: python .github/run_tests.py

      - name: Set up Node 22 for signer tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked JavaScript test dependencies
        run: npm ci --ignore-scripts

      - name: Test signer, dashboard and sales sync SQL
        run: npm test

      - name: Warn if the demo signing key would ship (pull requests only)
        if: github.event_name == 'pull_request'
        run: python .github/check_release_key.py --warn-only

  build-windows-usb:
    name: Windows 10/11 USB Portable & Setup.exe
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install locked dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      # The saved-AI-key feature uses Windows DPAPI through ctypes. Linux CI can only
      # simulate it, so prove the real Windows code path here before building.
      - name: Windows DPAPI self-test (saved AI key)
        run: python .github/dpapi_selftest.py

      # Pull requests build throw-away artifacts that are never handed to a customer, so a
      # missing secret must not break contributor CI — warn, and keep the demo key.
      # Release builds (push to main / v* tags / manual dispatch) fail closed instead:
      # shipping the demo key would let anyone mint a licence.
      - name: Inject owner Ed25519 public key (release builds fail closed)
        shell: bash
        env:
          CAFE_DESK_PUBLIC_KEY: ${{ secrets.CAFE_DESK_PUBLIC_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -n "$CAFE_DESK_PUBLIC_KEY" ]; then
              python .github/check_release_key.py --apply
              echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
            else
              python .github/check_release_key.py --warn-only --apply-if-available || true
              echo "HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
            fi
          elif [ -z "$CAFE_DESK_PUBLIC_KEY" ]; then
            echo "::error title=Missing repository secret::Set the CAFE_DESK_PUBLIC_KEY secret to your owner Ed25519 PUBLIC key (see README: One-time Owner Keypair Setup). Shipping without it would verify licenses against the demo key."
            exit 1
          else
            python .github/check_release_key.py --apply
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build USB-ready 1-Year Licensed folder (dist\CafeDesk)
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          for /f "delims=" %%v in ('python -c "from version import __version__; print(__version__)"') do set "CDVER=%%v"
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CafeDesk --icon "assets\icons\cafedesk.ico" --exclude-module admin_keygen --collect-all customtkinter --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all reportlab --collect-all cryptography --hidden-import win32com.client --hidden-import pythoncom --add-data "assets;assets" --add-data "cv-design-gallery.html;." --add-data "cafe-desk-manual.html;." --add-data "README.md;." app.py
          rem One source of truth for the customer-facing read-me, with the version stamped in.
          copy /y "packaging\HOW-TO-RUN-FROM-USB.txt" "dist\CafeDesk\HOW-TO-RUN-FROM-USB.txt" >nul
          >> "dist\CafeDesk\HOW-TO-RUN-FROM-USB.txt" echo.
          >> "dist\CafeDesk\HOW-TO-RUN-FROM-USB.txt" echo   This copy: Cafe Desk v!CDVER!
          (
            echo @echo off
            echo mkdir "%%~dp0CafeDeskData" 2^>nul
            echo echo Portable USB data folder enabled: "%%~dp0CafeDeskData"
            echo pause
          ) > "dist\CafeDesk\Enable-USB-Portable-Data.bat"

      # The installer is the artifact a café actually double-clicks. Refuse to wrap a folder
      # whose bundled bytecode still carries the demo key: a crafted /D override, a bypassed
      # build script or a hand-run PyInstaller must never turn into a downloadable Setup.exe.
      # When verified, this also writes `dist/CafeDesk/_internal/release-key.meta` from the
      # compiled PyInstaller bytecode so `tools/verify_release_key.py` can inspect Setup.exe.
      - name: Refuse to build an installer from a demo-key app folder
        if: github.event_name != 'pull_request' || env.HAS_SIGNING_KEY == 'true'
        shell: bash
        env:
          CAFE_DESK_PUBLIC_KEY: ${{ secrets.CAFE_DESK_PUBLIC_KEY }}
        run: python .github/check_release_key.py --dist-dir dist/CafeDesk

      - name: Zip USB-ready portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist\CafeDesk" -DestinationPath "CafeDesk-Windows-USB-Portable.zip" -Force

      - name: Build optional Windows Setup.exe (Inno Setup 6)
        if: github.event_name != 'pull_request' || env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          $ver = (python -c "from version import __version__; print(__version__)").Trim()
          iscc /DMyAppVersion=$ver "packaging\windows-installer.iss"

      - name: Verify packaged release artifacts embed owner Ed25519 public key
        if: github.event_name != 'pull_request' || env.HAS_SIGNING_KEY == 'true'
        shell: bash
        env:
          CAFE_DESK_PUBLIC_KEY: ${{ secrets.CAFE_DESK_PUBLIC_KEY }}
        run: |
          python tools/verify_release_key.py CafeDesk-Windows-USB-Portable.zip --expect "$CAFE_DESK_PUBLIC_KEY"
          python tools/verify_release_key.py installer-output/CafeDesk-Setup.exe --expect "$CAFE_DESK_PUBLIC_KEY"

      - name: Generate SHA-256 Checksums Manifest
        shell: pwsh
        env:
          CAFE_DESK_PUBLIC_KEY: ${{ secrets.CAFE_DESK_PUBLIC_KEY }}
        run: |
          $zipHash = (Get-FileHash "CafeDesk-Windows-USB-Portable.zip" -Algorithm SHA256).Hash.ToLower()
          $ver = (python -c "from version import __version__; print(__version__)").Trim()
          $manifest = [ordered]@{
            version = $ver.Trim()
            built_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          if ($env:CAFE_DESK_PUBLIC_KEY) {
            $pubHash = (python -c "import hashlib, os; print(hashlib.sha256(os.environ['CAFE_DESK_PUBLIC_KEY'].strip().encode('ascii')).hexdigest())").Trim()
            $manifest["public_key_sha256"] = $pubHash
          }
          if (Test-Path "installer-output\CafeDesk-Setup.exe") {
            $exeHash = (Get-FileHash "installer-output\CafeDesk-Setup.exe" -Algorithm SHA256).Hash.ToLower()
            $manifest["setup_exe"] = @{
              filename = "CafeDesk-Setup.exe"
              sha256 = $exeHash
            }
          }
          $manifest["usb_zip"] = @{
            filename = "CafeDesk-Windows-USB-Portable.zip"
            sha256 = $zipHash
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path "CafeDesk-Release-Checksums.json" -Encoding UTF8

      - name: Upload Windows USB Portable ZIP & Setup.exe artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CafeDesk-Windows-USB-and-Installer
          path: |
            CafeDesk-Windows-USB-Portable.zip
            installer-output/CafeDesk-Setup.exe
            CafeDesk-Release-Checksums.json
          retention-days: 30

      - name: Publish Direct Download Release on GitHub (main & v* tags)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (python -c "from version import __version__; print(__version__)").Trim()
          $exeHash = (Get-FileHash "installer-output\CafeDesk-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "CafeDesk-Windows-USB-Portable.zip" -Algorithm SHA256).Hash.ToLower()
          $lines = @(
            "### Cafe Desk v${ver} - Windows 10/11 Official Build",
            "",
            "- **1-Click Windows Installer:** CafeDesk-Setup.exe",
            "  - SHA-256: $exeHash",
            "- **USB Flash-Drive Portable Edition:** CafeDesk-Windows-USB-Portable.zip",
            "  - SHA-256: $zipHash",
            "",
            "Built automatically from commit ${{ github.sha }}.",
            "",
            "CafeDesk-Setup.exe installs Cafe Desk for the current Windows user and creates Desktop / Start Menu shortcuts.",
            "CafeDesk-Windows-USB-Portable.zip is a no-install folder: unzip it anywhere (USB stick, Desktop) and run CafeDesk.exe."
          )
          $notes = $lines -join "`n"

          $tagName = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}" } else { "v$ver" }
          gh release view $tagName >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            # Release already exists: its assets are IMMUTABLE. Replacing them would
            # invalidate the owner-signed SHA-256 stored in Supabase (app_releases) and
            # break every in-app update with "downloaded SHA-256 did not match owner
            # signature". Only upload assets that are missing (e.g. a previous run died
            # mid-upload); never replace an existing asset. To ship a new build, bump
            # version.py and push a new v* tag.
            $existing = @(gh release view $tagName --json assets --jq '.assets[].name')
            $missing = @()
            if ($existing -notcontains 'CafeDesk-Setup.exe') { $missing += 'installer-output\CafeDesk-Setup.exe' }
            if ($existing -notcontains 'CafeDesk-Windows-USB-Portable.zip') { $missing += 'CafeDesk-Windows-USB-Portable.zip' }
            if ($existing -notcontains 'CafeDesk-Release-Checksums.json') { $missing += 'CafeDesk-Release-Checksums.json' }
            if ($missing.Count -gt 0) {
              Write-Host "::warning title=Partial release $tagName::Uploading only missing assets: $($missing -join ', '). Existing assets were left untouched."
              gh release upload $tagName @missing
            } else {
              Write-Host "::warning title=Release $tagName already published::Assets are immutable once published so in-app updates keep verifying. This build (Setup.exe SHA-256 $exeHash, Portable ZIP SHA-256 $zipHash) was NOT published. Bump version.py to ship a new build."
            }
          } else {
            gh release create $tagName "installer-output\CafeDesk-Setup.exe" "CafeDesk-Windows-USB-Portable.zip" "CafeDesk-Release-Checksums.json" --title "Cafe Desk $tagName (Windows 10/11)" --notes $notes --latest
          }
