name: Build USB Portable & Installer Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-usb:
    name: Windows 10/11 USB Portable & Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run unit test suite
        run: python -m unittest -v test_services.py

      - name: Build USB-ready 1-Year Licensed folder (dist\CafeDesk)
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CafeDesk --exclude-module admin_keygen --collect-all customtkinter --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all reportlab --collect-all cryptography --hidden-import win32com.client --hidden-import pythoncom --add-data "assets;assets" --add-data "cv-design-gallery.html;." --add-data "README.md;." app.py
          (
            echo ============================================================
            echo   Cafe Desk v0.7.0 -- 1-Year Licensed USB Edition ^(Windows^)
            echo ============================================================
            echo.
            echo 1. COPY TO PC ^& ACTIVATE ^(LOCKED PER COMPUTER^):
            echo    Keep this ENTIRE "CafeDesk" folder together ^(including "_internal"^).
            echo    Copy the whole "CafeDesk" folder to the customer's Windows 10/11 PC
            echo    and run "CafeDesk.exe". No Python installation is needed!
            echo.
            echo    On first launch, Cafe Desk displays that PC's hardware Machine ID
            echo    ^(CD-XXXX-XXXX-XXXX^) and requires a 1-year Activation Key signed
            echo    by the owner. Copying the folder to another PC will NOT activate
            echo    the other PC.
          ) > "dist\CafeDesk\HOW-TO-RUN-FROM-USB.txt"
          (
            echo @echo off
            echo mkdir "%%~dp0CafeDeskData" 2^>nul
            echo echo Portable USB data folder enabled: "%%~dp0CafeDeskData"
            echo pause
          ) > "dist\CafeDesk\Enable-USB-Portable-Data.bat"

      - name: Zip USB-ready portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist\CafeDesk" -DestinationPath "CafeDesk-Windows-USB-Portable.zip" -Force

      - name: Build optional Windows Setup.exe (Inno Setup 6)
        shell: pwsh
        run: |
          iscc "packaging\windows-installer.iss"

      - name: Upload Windows USB Portable ZIP & Setup.exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CafeDesk-Windows-USB-and-Installer
          path: |
            CafeDesk-Windows-USB-Portable.zip
            installer-output/CafeDesk-Setup.exe
          retention-days: 30
